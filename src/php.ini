; Managed in the application repository.
; The S2I php image picks up php.ini and ${PHP_INSTANCE}.conf from the repo
; root at build time and uses them instead of its defaults -- see
; _3b-esa/publique/s2i-readme, php/README.md.
; Previously carried in the deploy ConfigMap, which was too late: phpman
; configures the instance during assemble.

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
unserialize_callback_func =
serialize_precision = -1
open_basedir = /appli/projects/EHA/nginx_1.24/html:/var/projects:/opt/app-root/src/
disable_functions =
disable_classes =
zend.enable_gc = On
expose_php = Off
max_execution_time = 30
max_input_time = 60
memory_limit = 128M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 1024
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On
html_errors = On
variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 200M
auto_prepend_file =
auto_append_file =
default_mimetype = "text/html"
default_charset = "UTF-8"
user_dir =
enable_dl = Off
cgi.fix_pathinfo=0
file_uploads = on
upload_tmp_dir = /var/projects/app/uploads
upload_max_filesize = 200M
max_file_uploads = 20
allow_url_fopen = Off
allow_url_include = Off
default_socket_timeout = 60
extension = apcu.so
extension = curl.so
extension = gd.so
extension = intl.so
extension=ldap
; mailparse not loaded: the 8.4 image ships a build that fails with
; "undefined symbol: mbfl_convert_filter_flush", and nothing in this
; application calls it. Loading it only adds a startup warning.
; extension = mailparse.so
extension = mbstring.so
extension = memcached.so
zend_extension = opcache.so
extension=openssl
extension = ssh2.so
; xdebug deliberately NOT loaded: strictly forbidden in production
; (s2i-readme php/README.md). Re-enable only in a local build.
extension=xmlrpc
extension = xsl.so
extension = zip.so
extension = zlib.so
extension = pgsql17.so
extension = pdo.so
extension = pdo_pgsql17.so
[CLI Server]
cli_server.color = On
[Date]
date.timezone = ('Europe/Paris')
[filter]
[iconv]
[imap]
[intl]
[sqlite3]
[Pcre]
[apcu]
apc.enabled=1
apc.shm_size=124M
apc.enable_cli=1
apc.serializer=php
[Pdo]
[Pdo_mysql]
pdo_mysql.cache_size = 2000
pdo_mysql.default_socket=
[Phar]
[mail function]
SMTP = localhost
smtp_port = 25
mail.add_x_header = On
[ODBC]
odbc.allow_persistent = On
odbc.check_persistent = On
odbc.max_persistent = -1
odbc.max_links = -1
odbc.defaultlrl = 4096
odbc.defaultbinmode = 1
[Interbase]
ibase.allow_persistent = 1
ibase.max_persistent = -1
ibase.max_links = -1
ibase.timestampformat = "%Y-%m-%d %H:%M:%S"
ibase.dateformat = "%Y-%m-%d"
/
ibase.timeformat = "%H:%M:%S"
[MySQLi]
mysqli.max_persistent = 100
mysqli.allow_persistent = Off
mysqli.max_links = 100
mysqli.cache_size = 2000
mysqli.default_port = 3306
mysqli.default_socket =
mysqli.default_host = localhost
mysqli.default_user =
mysqli.default_pw =
mysqli.reconnect = On
[mysqlnd]
mysqlnd.collect_statistics = On
mysqlnd.collect_memory_statistics = Off
[OCI8]
[PostgreSQL]
pgsql.allow_persistent = On
pgsql.auto_reset_persistent = Off
pgsql.max_persistent = -1
pgsql.max_links = -1
pgsql.ignore_notice = 0
pgsql.log_notice = 0
[bcmath]
bcmath.scale = 0
[browscap]
[Session]
session.save_handler = files
; Was "/var/projects/PHPEHA/php-fpm_8.2/session" - which hardcoded the PHP minor
; version and an instance name ("PHPEHA") that does not match PHP_INSTANCE=EHA.
; /tmp/session is the image default and survives a version bump; it also allows
; a read-only root filesystem provided /tmp is a writable volume.
session.save_path = "/tmp/session"
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 1
session.name = PHPSESSID
session.auto_start = 0
session.cookie_lifetime = 0
session.cookie_path = /
session.cookie_domain =
session.cookie_httponly = On
session.serialize_handler = php
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440
session.referer_check =
session.cache_limiter = nocache
session.cache_expire = 180
session.use_trans_sid = 0
session.trans_sid_tags = "a=href,area=href,frame=src,form="
; session.sid_length and session.sid_bits_per_character are deprecated as of
; PHP 8.4 and were printing two "PHP Startup" deprecations on every invocation,
; including in the build log. Removed rather than silenced: both were at values
; the engine now uses anyway.
[Assertion]
zend.assertions = -1
[COM]
[mbstring]
[gd]
[exif]
[Tidy]
tidy.clean_output = Off
[soap]
soap.wsdl_cache_enabled=1
soap.wsdl_cache_dir="/tmp"
soap.wsdl_cache_ttl=86400
soap.wsdl_cache_limit = 5
[sysvshm]
[ldap]
ldap.max_links = 100
[dba]
[opcache]
[curl]
[openssl]          
