kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: achatpedia-backend-deploy-template
  annotations:
    description: >-
      Backend (PHP-FPM + nginx + haproxy) deployment for Achatpedia on CaaS.
      Declares the ConfigMap, Deployment, Service and Route as a single unit so
      the whole runtime shape is versioned alongside the application code.
parameters:
  - name: APPLICATION_NAME
    value: "achatpedia"
    required: true
  - name: IMAGE_NAME
    description: "ImageStream holding the backend image"
    value: "dck_achatpedia-back"
    required: true
  - name: IMAGE_TAG
    description: "Image tag, set by the pipeline from CI_COMMIT_REF_SLUG"
    required: true
  - name: ENV
    description: "Deployment environment, selects the *-${ENV} secrets"
    value: "recette"
    required: true
  - name: NAMESPACE_DEPLOY_BACKEND
    value: "eha-achatpedia-ext-ns-be-p"
    required: true
  - name: SERVICE_ACCOUNT_NAME
    value: "achatpedia-caas-eha"
    required: true
  - name: SERVER_NAME
    description: "Public hostname served by this route"
    value: "achatpedia-preprod-back.ext-ns-be-p.caas-ext-p.automation.edf.fr"
    required: true
  - name: ELASTICSEARCH_HOST
    value: "padaone-preprod.edf.fr:29443"
    required: true
  - name: ROUTE_TIMEOUT
    value: "10m"
    required: true
  - name: CPU_REQUEST
    value: "500m"
  - name: CPU_LIMIT
    value: "1"
  - name: MEMORY_REQUEST
    value: "2Gi"
  - name: MEMORY_LIMIT
    value: "2Gi"
  - name: LOCAL_REGISTRY
    value: "image-registry.openshift-image-registry.svc:5000"
    required: true
  # --- Application configuration ---------------------------------------------
  - name: FRONTEND_DNS_NAME
    description: >-
      Public hostname of the *frontend*. Every SAML URL the IdP redirects the
      browser to must be a frontend URL: the backend is firewalled and is only
      ever reached through the frontend's /api proxy.
    required: true

  # --- Application secrets, from OpenBao via the get-secret job ---------------
  - name: DB_HOST
    required: true
  - name: DB_PORT
    value: "5432"
    required: true
  - name: DB_NAME
    required: true
  - name: DB_SCHEMA
    required: true
  - name: DB_USER
    required: true
  - name: DB_PWD
    required: true
  # The SAML federation, held in OpenBao as one unit. Not all of these are
  # secret - entity IDs, endpoints and the IdP's public certificate appear in
  # published metadata - but keeping them together means the federation is
  # described in one place and repointed per environment without a commit.
  - name: SAML_BASE_URL
    description: "Frontend origin, e.g. https://eha-v2-preprod-caas.edf.fr"
    required: true
  - name: SAML_BASE_URL_PATH
    description: "simplesamlphp baseurlpath, under the frontend's /api proxy"
    required: true
  - name: SAML_ENTITY_ID
    description: "This SP's entity ID"
    required: true
  - name: SAML_IDP
    description: "IdP entity ID, e.g. idp://REC-STANDARD.MULTIAUTH-SECURINTERNET/20290701"
    required: true
  - name: IDP_NUMBER
    description: >-
      Gardian metaAlias suffix, e.g. idp11-20290701. Unset, the application
      falls back to the retired 'idp3-20240420' and every SSO endpoint URL is
      wrong - which is silent until login fails.
    required: true
  - name: SAML_IDP_BASE_URL
    description: "Gardian webSSO base URL"
    required: true
  # Optional, and deliberately so. These feed only saml20-sp-remote.php, which
  # describes a *remote SP* and is read solely when simplesamlphp acts as an
  # IdP - config.php sets 'enable.saml20-idp' => false, so this deployment
  # never consults it.
  #
  # They also describe the Gardian websso *proxy*, which this project should
  # not use: the proxy cannot do MFA over the internet. The live path goes to
  # the non-proxy IdP (SAML_IDP / SAML_IDP_BASE_URL) with IDP_NUMBER=idp11-*,
  # which is what makes MFA work.
  - name: SAML_SP_META_ID
    description: "Gardian proxy SP entity ID. Unused while enable.saml20-idp is false."
    value: ""
  - name: SAML_SP_BASE_URL
    description: "Gardian proxy webSSO base URL. Unused while enable.saml20-idp is false."
    value: ""
  - name: SAML_KEYS
    description: >-
      The IdP's signing certificate, base64 DER on a single line (no PEM
      header). Used as X509Certificate in both metadata files.
    required: true
  - name: SAML_SECRET_SALT
    description: >-
      simplesamlphp's secretsalt. Not optional: simplesamlphp refuses to start
      while it is left at the stock 'defaultsecretsalt' value.
    required: true
  - name: SMTP_PWD
    required: true
  - name: HLK_API_PASS
    required: true
  - name: HLK_API_PASS_V2
    required: true

  - name: TLS_CERTIFICATE
    description: >-
      PEM certificate chain for SERVER_NAME. Exported by the deploy job's
      before_script from the base64 the get-secret job read out of OpenBao -
      never stored in git and never in a CI/CD variable. This is the *backend*
      certificate (eha-v2-preprod-api-caas.edf.fr); it is a different
      certificate from the frontend's and lives at a different OpenBao path.
    required: true
  - name: TLS_KEY
    description: >-
      PEM private key for SERVER_NAME. Same path as TLS_CERTIFICATE.
    required: true
  - name: IMAGE_RELEASE_DATE
  - name: IMAGE_RELEASE_NUMBER

objects:
  # ---------------------------------------------------------------------------
  # 1. Application configuration (php-fpm pool, php.ini, filebeat)
  #
  # The php-fpm pool and php.ini below are carried over unchanged from the
  # previous deployment/openshift/configmap-template.yml.
  # ---------------------------------------------------------------------------
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: "cm-backend-${APPLICATION_NAME}-${IMAGE_TAG}"
      namespace: "${NAMESPACE_DEPLOY_BACKEND}"
      labels:
        app: "backend-${APPLICATION_NAME}-${IMAGE_TAG}"
    data:
      # php.ini and EHA.conf are no longer here: the S2I image takes them
      # from the repository root at build time. Mounting them at run time
      # shadowed the instance configuration phpman had generated.
      filebeat.yml: |-
        filebeat.inputs:
        - input_type: log
          paths:
            - /achatpedia/log/*.log
        #output.console:
        #  pretty: true
        setup.template.enabled: false
        #setup.template.overwrite: true
        output.elasticsearch:
          hosts: ["${ELASTICSEARCH_HOST}"]
          protocol: "https"
          username: ${SECRETS_PADAONE_USERNAME:PUSERNAME}
          password: ${SECRETS_PADAONE_PASSWORD:PPASSWORD}
          index: pp1-padaone-events-dag-achatpedia-logs-%{+yyyy.MM}
  # ---------------------------------------------------------------------------
  # 2. nginx reverse-proxy configuration
  #
  # Captured verbatim from the cluster-managed cm-rp-nginx ConfigMap in
  # eha-achatpedia-ext-ns-be-p so the reverse-proxy config is versioned with the
  # code instead of being edited by hand in the namespace.
  # ---------------------------------------------------------------------------
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: "cm-nginx-backend-${APPLICATION_NAME}-${IMAGE_TAG}"
      namespace: "${NAMESPACE_DEPLOY_BACKEND}"
      labels:
        app: "backend-${APPLICATION_NAME}-${IMAGE_TAG}"
    data:
      nginx.conf: |-
        worker_processes  auto; worker_rlimit_nofile 100000; #user              webadm;
        events {
            worker_connections  768;
            use epoll;
            multi_accept on;
        }
        error_log   /dev/stdout info;
        http {
            server_tokens off;
            include       mime.types;
            default_type  application/octet-stream;

            # TLS terminates at the OpenShift edge Route, so this nginx only
            # ever sees plain HTTP on 8080 and nginx's own $https is empty.
            # PHP therefore believed every request was insecure, and
            # simplesamlphp refused to start a session at all:
            #
            #   CriticalConfigurationError: The configuration is invalid:
            #   Setting secure cookie on plain HTTP (except on localhost)
            #   is not allowed.
            #
            # The router sets X-Forwarded-Proto on an edge route, so trust that
            # and fall back to the real connection scheme when it is absent -
            # rather than hard-coding "on", which would lie to the application
            # about any genuinely plain-HTTP request reaching the pod.
            map $http_x_forwarded_proto $forwarded_https {
                https     on;
                default   $https;
            }

            client_header_timeout           1m;
            client_body_timeout             1m;
            client_header_buffer_size       2k;
            client_body_buffer_size         256k;
            client_max_body_size            256m;
            large_client_header_buffers     4   8k;
            send_timeout                    30;
            reset_timedout_connection       on;

            open_file_cache max=200000 inactive=20s;
            open_file_cache_valid 30s;
            open_file_cache_min_uses 2;
            open_file_cache_errors on;

            sendfile        on;
            tcp_nopush     on;
            tcp_nodelay on;
            keepalive_timeout 65;
            types_hash_max_size 2048;
            sendfile_max_chunk 512;

            access_log    off;

            gzip  on;
            gzip_min_length 10240;
            gzip_comp_level 1;
            gzip_vary on;
            gzip_disable msie6;
            gzip_proxied expired no-cache no-store private auth;
            gzip_types
                # text/html is always compressed by HttpGzipModule
                text/css
                text/javascript
                text/xml
                text/plain
                text/x-component
                application/javascript
                application/x-javascript
                application/json
                application/xml
                application/rss+xml
                application/atom+xml
                font/truetype
                font/opentype
                application/vnd.ms-fontobject
                image/svg+xml;


                client_body_temp_path /var/projects/instance/nginx_1/run/nginx-client-body;


                proxy_cache_path   /var/lib/nginx/cache/proxy_cache levels=1:2 keys_zone=instance_cache:10m max_size=10g inactive=24h;
                proxy_cache_key "$host$request_uri $cookie_user";
                #proxy_temp_path /var/projects/instance/nginx_1/run/nginx-proxy;
                proxy_ignore_headers Expires Cache-Control;
                proxy_cache_use_stale error timeout invalid_header http_502;
                proxy_cache_valid any 3d;
                include application.conf;
                include proxy.conf;
          }
      application.conf: |-
        server {
          # 8443 terminates TLS for the passthrough Route; the certificate is
          # the one the pipeline reads from OpenBao, mounted from
          # sec-backend-<tag>-tls.
          #
          # 8080 stays for in-cluster plain HTTP. It is not published by the
          # Route, so nothing external can reach it; it keeps debugging from
          # inside the pod and any future HTTP probe working. A request
          # arriving there is correctly seen as insecure by PHP, because the
          # X-Forwarded-Proto map falls back to nginx's own $https.
          listen   8080;
          listen   8443 ssl;

          ssl_certificate      /var/lib/nginx/ssl/tls.crt;
          ssl_certificate_key  /var/lib/nginx/ssl/tls.key;
          ssl_protocols        TLSv1.2 TLSv1.3;
          ssl_prefer_server_ciphers off;
          ssl_session_cache    shared:SSL:10m;
          ssl_session_timeout  10m;

          server_name _;

          # The S2I build context is src/ (build_context_dir in .gitlab-ci.yml),
          # so the staged application root is the contents of src/ and the front
          # controller is at public/index.php. Same layout the old Dockerfile
          # produced with `COPY ./src /opt/app-root/src/`.
          root /opt/app-root/src/public;

          open_file_cache max=5000 inactive=180;
          open_file_cache_valid 2m;
          open_file_cache_min_uses 2;
          open_file_cache_errors on;

          index           index.php;

          add_header Content-Security-Policy "";

          location / {
                try_files $uri /index.php?$query_string;
          }

          # -------------------------------------------------------------------
          # simplesamlphp.
          #
          # .s2i/bin/assemble installs it at /opt/app-root/src/simplesamlphp,
          # i.e. OUTSIDE the docroot (/opt/app-root/src/public), and nothing
          # links it in. Without this block the IdP's assertion is silently
          # lost: a POST to
          #     /simplesaml/module.php/saml/sp/saml2-acs.php/default-sp
          # does not match `location ~ \.php$` below - that regex requires the
          # URI to END in .php, and this one ends in /default-sp - so it falls
          # through to `location /`, try_files misses, and it is handed to the
          # application front controller, whose router knows only /saml/login,
          # /saml/logout and /saml/attributes. Confirmed in the pod: the ACS
          # POST produced no nginx access entry for simplesamlphp at all.
          #
          # `^~` makes this prefix beat the regex locations whatever the order,
          # which also sidesteps the duplicate `location ~ \.php$` further down
          # (the second one, `return 404`, is already dead - nginx takes the
          # first matching regex).
          #
          # Reached only via the frontend proxy (F5 -> frontend nginx /api ->
          # here); nothing new is exposed. Static assets under /simplesaml/
          # still 404 because this container has no volume carrying the app
          # image - only PHP works, which is all the ACS needs.
          location ^~ /simplesaml {
              alias /opt/app-root/src/simplesamlphp/public;
              index index.php;

              # Non-greedy `.+?\.php` is load-bearing: this URL carries TWO
              # .php segments (module.php and saml2-acs.php). A greedy match
              # splits at the second and yields a SCRIPT_FILENAME of
              # .../public/module.php/saml/sp/saml2-acs.php, which is not a
              # file. Non-greedy splits at the first, giving module.php as the
              # script and /saml/sp/saml2-acs.php/default-sp as PATH_INFO -
              # exactly what simplesamlphp dispatches on.
              location ~ ^(?<prefix>/simplesaml)(?<phpfile>.+?\.php)(?<pathinfo>/.*)?$ {
                  include fastcgi_params;
                  fastcgi_pass 127.0.0.1:9000;

                  # Inside an alias location $document_root is the alias target,
                  # so this resolves in the php-fpm container's filesystem.
                  fastcgi_param SCRIPT_FILENAME $document_root$phpfile;

                  # PATH_INFO is NOT in the global fastcgi_params, and
                  # fastcgi_split_path_info only sets a variable - nginx does
                  # not forward it by itself. module.php routes on this.
                  fastcgi_param PATH_INFO       $pathinfo if_not_empty;

                  # Without this simplesamlphp derives its self-URL from the
                  # aliased path and stops matching the ACS the IdP posted to,
                  # which surfaces much later as a Destination mismatch.
                  fastcgi_param SCRIPT_NAME     /simplesaml$phpfile;
              }
          }

          location ~ \.php$ {
                    include fastcgi_params;
                    fastcgi_split_path_info ^(.+\.php)(/.+)$;
                    fastcgi_pass 127.0.0.1:9000;
                    fastcgi_index index.php;
                    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            }




            location ~ ^/(status|ping)$ {
                allow 127.0.0.1;
                #fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_index index.php;
                include fastcgi_params;
                fastcgi_pass 127.0.0.1:9000;
            }

            # return 404 for all other php files not matching the front controller
            # this prevents access to other php files you don't want to be accessible.
            location ~ \.php$ {
                return 404;
            }

            location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|flv|mp4|ico)$ {
                expires 7d;
                access_log off;
            }

            location ~ .*\.(js|css)?$ {
                expires 7d;
                access_log off;
            }

            # URL for health checks
            location /nginx-health {
              access_log off;
              default_type text/plain;
              return 200 "healthy\n";
            }

            client_max_body_size 100M;

        }
      proxy.conf: |-

        proxy_set_header Host                   $host; 
        proxy_set_header X-Real-IP              $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto      $scheme; 
        proxy_connect_timeout 30; 
        proxy_send_timeout 30;
      fastcgi_params: |-

        fastcgi_param  QUERY_STRING       $query_string;
        fastcgi_param  REQUEST_METHOD     $request_method;
        fastcgi_param  CONTENT_TYPE       $content_type;
        fastcgi_param  CONTENT_LENGTH     $content_length;

        fastcgi_param  SCRIPT_NAME        $fastcgi_script_name;
        fastcgi_param  REQUEST_URI        $request_uri;
        fastcgi_param  DOCUMENT_URI       $document_uri;
        fastcgi_param  DOCUMENT_ROOT      $document_root;
        fastcgi_param  SERVER_PROTOCOL    $server_protocol;
        fastcgi_param  REQUEST_SCHEME     $scheme;
        # $forwarded_https, not $https: TLS ends at the edge Route, so $https is
        # always empty here. See the map in nginx.conf.
        fastcgi_param  HTTPS              $forwarded_https if_not_empty;

        fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
        fastcgi_param  SERVER_SOFTWARE    nginx/$nginx_version;

        fastcgi_param  REMOTE_ADDR        $remote_addr;
        fastcgi_param  REMOTE_PORT        $remote_port;
        fastcgi_param  SERVER_ADDR        $server_addr;
        fastcgi_param  SERVER_PORT        $server_port;
        fastcgi_param  SERVER_NAME        $server_name;

        # PHP only, required if PHP was built with --enable-force-cgi-redirect
        fastcgi_param  REDIRECT_STATUS    200;

        fastcgi_intercept_errors on;
        fastcgi_ignore_client_abort off;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 3600;
        fastcgi_read_timeout 3600;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;

          #fastcgi_intercept_errors on;
        #fastcgi_ignore_client_abort off;
      mime.types: |-
        types {
          text/html                                        html htm shtml;
          text/css                                         css;
          text/xml                                         xml;
          image/gif                                        gif;
          image/jpeg                                       jpeg jpg;
          application/javascript                           js;
          application/atom+xml                             atom;
          application/rss+xml                              rss;

          text/mathml                                      mml;
          text/plain                                       txt;
          text/vnd.sun.j2me.app-descriptor                 jad;
          text/vnd.wap.wml                                 wml;
          text/x-component                                 htc;

          image/png                                        png;
          image/svg+xml                                    svg svgz;
          image/tiff                                       tif tiff;
          image/vnd.wap.wbmp                               wbmp;
          image/webp                                       webp;
          image/x-icon                                     ico;
          image/x-jng                                      jng;
          image/x-ms-bmp                                   bmp;

          application/font-woff                            woff;
          application/java-archive                         jar war ear;
          application/json                                 json;
          application/mac-binhex40                         hqx;
          application/msword                               doc;
          application/pdf                                  pdf;
          application/postscript                           ps eps ai;
          application/rtf                                  rtf;
          application/vnd.apple.mpegurl                    m3u8;
          application/vnd.google-earth.kml+xml             kml;
          application/vnd.google-earth.kmz                 kmz;
          application/vnd.ms-excel                         xls;
          application/vnd.ms-fontobject                    eot;
          application/vnd.ms-powerpoint                    ppt;
          application/vnd.oasis.opendocument.graphics      odg;
          application/vnd.oasis.opendocument.presentation  odp;
          application/vnd.oasis.opendocument.spreadsheet   ods;
          application/vnd.oasis.opendocument.text          odt;
          application/vnd.openxmlformats-officedocument.presentationml.presentation
                                                          pptx;
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
                                                          xlsx;
          application/vnd.openxmlformats-officedocument.wordprocessingml.document
                                                          docx;

          application/vnd.wap.wmlc                         wmlc;
          application/x-7z-compressed                      7z;
          application/x-cocoa                              cco;
          application/x-java-archive-diff                  jardiff;
          application/x-java-jnlp-file                     jnlp;
          application/x-makeself                           run;
          application/x-perl                               pl pm;
          application/x-pilot                              prc pdb;
          application/x-rar-compressed                     rar;
          application/x-redhat-package-manager             rpm;
          application/x-sea                                sea;
          application/x-shockwave-flash                    swf;
          application/x-stuffit                            sit;
          application/x-tcl                                tcl tk;
          application/x-x509-ca-cert                       der pem crt;
          application/x-xpinstall                          xpi;
          application/xhtml+xml                            xhtml;
          application/xspf+xml                             xspf;
          application/zip                                  zip;

          application/octet-stream                         bin exe dll;
          application/octet-stream                         deb;
          application/octet-stream                         dmg;
          application/octet-stream                         iso img;
          application/octet-stream                         msi msp msm;

          audio/midi                                       mid midi kar;
          audio/mpeg                                       mp3;
          audio/ogg                                        ogg;
          audio/x-m4a                                      m4a;
          audio/x-realaudio                                ra;

          video/3gpp                                       3gpp 3gp;
          video/mp2t                                       ts;
          video/mp4                                        mp4;
          video/mpeg                                       mpeg mpg;
          video/quicktime                                  mov;
          video/webm                                       webm;
          video/x-flv                                      flv;
          video/x-m4v                                      m4v;
          video/x-mng                                      mng;
          video/x-ms-asf                                   asx asf;
          video/x-ms-wmv                                   wmv;
          video/x-msvideo                                  avi;
        }


  # ---------------------------------------------------------------------------
  # 3. Backend Deployment
  # ---------------------------------------------------------------------------
  - kind: Deployment
    apiVersion: apps/v1
    metadata:
      name: "backend-${APPLICATION_NAME}-${IMAGE_TAG}"
      labels:
        app: "backend-${APPLICATION_NAME}-${IMAGE_TAG}"
        build-template: devops_openshift-simple-deploy-template-Deployment
      annotations:
        # The container name inside fieldPath MUST match a containers[].name
        # below. When it does not, the trigger silently matches nothing and the
        # application image is never injected into the pod.
        image.openshift.io/triggers: |
          [
            {
              "from": {
                "kind": "ImageStreamTag",
                "name": "${IMAGE_NAME}:${IMAGE_TAG}"
              },
              "fieldPath": "spec.template.spec.containers[?(@.name==\"backend-${APPLICATION_NAME}\")].image"
            }
          ]
    spec:
      replicas: 1
      revisionHistoryLimit: 3
      progressDeadlineSeconds: 600
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: "backend-${APPLICATION_NAME}-${IMAGE_TAG}"
      template:
        metadata:
          labels:
            app: "backend-${APPLICATION_NAME}-${IMAGE_TAG}"
        spec:
          serviceAccountName: "${SERVICE_ACCOUNT_NAME}"
          restartPolicy: Always
          dnsPolicy: ClusterFirst
          schedulerName: default-scheduler
          terminationGracePeriodSeconds: 30
          containers:
            # -----------------------------------------------------------------
            # nginx reverse proxy in front of PHP-FPM.
            # Its configuration still comes from the cluster-managed cm-rp-nginx
            # ConfigMap rather than from this repository.
            # -----------------------------------------------------------------
            - name: nginx-rp
              image: "${LOCAL_REGISTRY}/openshift/dck_nginx-ubi8:1.26"
              imagePullPolicy: Always
              command:
                - /usr/libexec/s2i/run
              # application.conf declares a single `listen 8080;`. The previous
              # Service also published 8181 and the Route did passthrough to it,
              # but nothing ever listened there.
              ports:
                - containerPort: 8080
                  protocol: TCP
                # Terminates TLS for the passthrough Route.
                - containerPort: 8443
                  protocol: TCP
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - name: appli-sharing
                  mountPath: /appli/projects/EHA/nginx_1.26/html
                - name: test-app-nginx-volume-1
                  mountPath: /var/projects/instance/nginx_1.26/cache/
                - name: test-app-nginx-volume-2
                  mountPath: /var/projects/instance/nginx_1.26/run/
                - name: nginx-conf
                  mountPath: /appli/projects/instance/nginx/conf
                - name: app-nginx-crt
                  mountPath: /var/lib/nginx/ssl
                - name: client-body
                  mountPath: /var/projects/instance/nginx_1/run/nginx-client-body
                - name: client-cache
                  mountPath: /var/lib/nginx/cache/proxy_cache
                - name: proxy-temp
                  mountPath: /opt/nginx/1.26/proxy_temp
                - name: fastcgi-temp
                  mountPath: /opt/nginx/1.26/fastcgi_temp
                - name: uwsgi-temp
                  mountPath: /opt/nginx/1.26/uwsgi_temp
                - name: scgi-temp
                  mountPath: /opt/nginx/1.26/scgi_temp
                - name: pid-vol
                  mountPath: /opt/nginx/1.26/logs/
                  subPath: nginx.pid
                - name: simple-saml-config
                  mountPath: /opt/app-root/etc/simplesamlphp/config
                - name: simplesaml-public
                  mountPath: /opt/app-root/etc/simplesamlphp/public
                - name: simplesaml-cache
                  mountPath: /var/cache/simplesamlphp

            # -----------------------------------------------------------------
            # PHP-FPM application. Target of the image trigger above.
            # -----------------------------------------------------------------
            - name: "backend-${APPLICATION_NAME}"
              image: "${LOCAL_REGISTRY}/${NAMESPACE_DEPLOY_BACKEND}/${IMAGE_NAME}:${IMAGE_TAG}"
              imagePullPolicy: Always
              ports:
                - containerPort: 9000
                  protocol: TCP
              envFrom:
                # Order matters only for duplicate keys; there are none.
                # These supply the application's .env values as real
                # environment variables - see ConfigMap 4b for why that works
                # and why .env itself is left alone.
                - configMapRef:
                    name: "cm-backend-${APPLICATION_NAME}-${IMAGE_TAG}-app"
                - secretRef:
                    name: "sec-backend-${APPLICATION_NAME}-${IMAGE_TAG}-app"
                # Dropped: secretRef eha-${ENV}-env. It carries POSTGRES_DB,
                # POSTGRES_HOST, POSTGRES_PASSWORD, POSTGRES_POOLSIZE,
                # POSTGRES_PORT and POSTGRES_USER - none of which this
                # application reads. It reads DB_HOST/DB_PORT/DB_NAME/
                # DB_SCHEMA/DB_USER/DB_PWD, now supplied by the Secret above.
              env:
                # Only PHP_INSTANCE matters at run time - it selects the
                # instance to start - and it must match the value the image was
                # built with. COMPOSER_INSTALL, PHP_PORT, PHP_EXTENSIONS and
                # PHP_FILE_DIR are build-time inputs to phpman and have no
                # effect here; they are set via build_env in .gitlab-ci.yml.
                # DEBUG=1 is also build-time (verbose assemble) and was never
                # appropriate for a production runtime.
                - name: PHP_INSTANCE
                  value: EHA
              resources:
                requests:
                  cpu: "${CPU_REQUEST}"
                  memory: "${MEMORY_REQUEST}"
                limits:
                  cpu: "${CPU_LIMIT}"
                  memory: "${MEMORY_LIMIT}"
              securityContext:
                readOnlyRootFilesystem: false
              startupProbe:
                tcpSocket:
                  port: 9000
                initialDelaySeconds: 10
                timeoutSeconds: 1
                periodSeconds: 5
                successThreshold: 1
                failureThreshold: 30
              readinessProbe:
                tcpSocket:
                  port: 9000
                timeoutSeconds: 3
                periodSeconds: 10
                successThreshold: 1
                failureThreshold: 3
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - name: log-dir
                  mountPath: /var/projects/EHA/php-fpm_8.4/log/
                - name: appli-sharing
                  mountPath: /appli/projects/EHA/nginx_1.26/html
                - name: simplesaml-public
                  mountPath: /opt/app-root/etc/simplesamlphp/src
                # The `backend-config` mount is gone on purpose. It mounted the
                # ConfigMap over /appli/projects/EHA/php-fpm_8.4/conf - the very
                # directory phpman populates during assemble - so it shadowed the
                # instance configuration the image had just built. php.ini and
                # EHA.conf now live at the repository root and are baked in by
                # the S2I build.
                - name: simplesaml-cache
                  mountPath: /var/cache/simplesamlphp
                - name: simple-saml-config
                  mountPath: /opt/app-root/etc/simplesamlphp/config
                # php.ini puts sessions in /tmp/session; keep /tmp writable.
                - name: tmp
                  mountPath: /tmp
                # A second emptyDir nested inside /tmp, purely so the directory
                # exists. session.save_path is /tmp/session and PHP does not
                # create it: session_start() fails with "No such file or
                # directory" and simplesamlphp cannot open a session at all.
                # Creating it at build time does not help - /tmp is an emptyDir
                # and is replaced at runtime - and a mount is declarative,
                # where a startup script would be one more thing to keep alive.
                - name: session
                  mountPath: /tmp/session

            # -----------------------------------------------------------------
            # Log shipping to PADAONE.
            # -----------------------------------------------------------------
            - name: filebeat-container
              image: "${LOCAL_REGISTRY}/openshift/dck_filebeat-ubi:7.9.3"
              imagePullPolicy: IfNotPresent
              env:
                - name: SECRETS_PADAONE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      key: PUSERNAME
                      name: "padaone-credentials-${ENV}"
                - name: SECRETS_PADAONE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: PPASSWORD
                      name: "padaone-credentials-${ENV}"
              ports:
                - containerPort: 80
                  protocol: TCP
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 100m
                  memory: 192Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - name: log-dir
                  mountPath: /var/projects/EHA/php-fpm_8.4/log/
                - name: filebeat-config-volume
                  mountPath: /opt/filebeat/config/
                  readOnly: true
                - name: filebeat-data-volume
                  mountPath: /opt/filebeat/data/

            # -----------------------------------------------------------------
            # haproxy sidecar used for database access.
            # -----------------------------------------------------------------
            - name: haproxy-container
              image: "${LOCAL_REGISTRY}/${NAMESPACE_DEPLOY_BACKEND}/dck_haproxy:2.8.2"
              imagePullPolicy: Always
              command:
                - haproxy
                - '-f'
                - /etc/haproxy/haproxy.cfg
              ports:
                - containerPort: 5433
                  protocol: TCP
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - name: haproxy-secret-volume
                  mountPath: /etc/haproxy/
                  readOnly: true
          volumes:
            - name: appli-tmp
              emptyDir: {}
            - name: appli-sharing
              emptyDir: {}
            - name: simplesaml-public
              emptyDir: {}
            - name: simplesaml-cache
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            # Sessions do not survive a pod restart, which logs users out. That
            # is acceptable at one replica; scaling out needs a shared store
            # (simplesamlphp supports sql and redis via store.type).
            - name: session
              emptyDir: {}
            - name: log-dir
              emptyDir: {}
            - name: test-app-nginx-volume-1
              emptyDir: {}
            - name: test-app-nginx-volume-2
              emptyDir: {}
            - name: client-body
              emptyDir: {}
            - name: client-cache
              emptyDir: {}
            - name: proxy-temp
              emptyDir: {}
            - name: fastcgi-temp
              emptyDir: {}
            - name: scgi-temp
              emptyDir: {}
            - name: uwsgi-temp
              emptyDir: {}
            - name: pid-vol
              emptyDir: {}
            - name: filebeat-data-volume
              emptyDir: {}
            - name: nginx-conf
              configMap:
                name: "cm-nginx-backend-${APPLICATION_NAME}-${IMAGE_TAG}"
                defaultMode: 420
            - name: simple-saml-config
              configMap:
                name: simple-saml-config
                defaultMode: 420
            - name: filebeat-config-volume
              configMap:
                name: "cm-backend-${APPLICATION_NAME}-${IMAGE_TAG}"
                defaultMode: 420
            - name: app-nginx-crt
              secret:
                # Was the standing `app-nginx-crt` secret in this namespace: a
                # CN=EHA certificate with no SANs that expired in 2024. It was
                # harmless while the Route terminated TLS at the edge and
                # nothing read it; under passthrough it is what clients would
                # actually be offered, so point at the certificate the pipeline
                # reads from OpenBao instead.
                secretName: "sec-backend-${APPLICATION_NAME}-${IMAGE_TAG}-tls"
                # 0440: readable by the root group, which is the group an
                # arbitrary OpenShift UID runs in. A private key has no reason
                # to be world-readable even inside the container.
                defaultMode: 288
            - name: haproxy-secret-volume
              secret:
                secretName: "eha-${ENV}-haproxy"
                defaultMode: 440

  # ---------------------------------------------------------------------------
  # 4. Backend Service
  # ---------------------------------------------------------------------------
  - kind: Service
    apiVersion: v1
    metadata:
      name: "backend-${APPLICATION_NAME}"
      labels:
        app: "backend-${APPLICATION_NAME}-${IMAGE_TAG}"
    spec:
      type: ClusterIP
      sessionAffinity: None
      ports:
        - name: http
          port: 8080
          targetPort: 8080
          protocol: TCP
        # The Route targets this port. Named "https" because the pod, not the
        # router, terminates TLS on it.
        - name: https
          port: 8443
          targetPort: 8443
          protocol: TCP
      selector:
        app: "backend-${APPLICATION_NAME}-${IMAGE_TAG}"

  # ---------------------------------------------------------------------------
  # 4b. Application configuration (non-secret)
  #
  # The committed src/.env ships every value as the literal string "null" - it
  # is a template that, on the VM, Ansible rewrote at deploy time from
  # eha-web-achat/exploitation (inventories/group_vars/EHA/config_back.yml and
  # group_vars/all.yml). Nothing rewrote it on CaaS, so the application ran
  # entirely unconfigured. The values below are those inventories, translated
  # to this namespace.
  #
  # These reach the application as container environment variables rather than
  # by rewriting .env: php-fpm passes the environment through (clear_env = no)
  # and php.ini now sets variables_order = "EGPCS", so Core\Util\DotEnv finds
  # each key already present in $_ENV and leaves it alone. .env stays as the
  # defaults file; anything set here wins.
  #
  # Secrets are NOT here - see the Secret below.
  # ---------------------------------------------------------------------------
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: "cm-backend-${APPLICATION_NAME}-${IMAGE_TAG}-app"
      namespace: "${NAMESPACE_DEPLOY_BACKEND}"
      labels:
        app: "backend-${APPLICATION_NAME}-${IMAGE_TAG}"
    data:
      # --- environment identity ---------------------------------------------
      # Compared case-sensitively against 'PROD' / 'PREPROD' in the Hotline
      # managers, which pick the mail subject prefix and the recipients.
      ENV: "PREPROD"
      INSTALL_ENV: "PREPROD"

      # --- logging ----------------------------------------------------------
      # DEFAULT_LOGS_PATH is the log-dir emptyDir, shared with filebeat.
      # MAX_FILE is monolog's RotatingFileHandler $maxFiles (MAX_BACKUP_INDEX).
      DEFAULT_LOGS_PATH: "/var/projects/EHA/php-fpm_8.4/log"
      MAX_FILE: "5"

      # --- application ------------------------------------------------------
      CONFIG_DOMAINE: "${FRONTEND_DNS_NAME}"
      CACHE_TTL: "300"
      EXPIRE_AFTER: "7200"
      SHOW_PRIVATE_DOC: "1"

      # --- webSSO / SAML ----------------------------------------------------
      # The federation configuration itself now lives in OpenBao with the salt,
      # so it is held in one place and changed per environment without a commit
      # (SAML_BASE_URL, SAML_BASE_URL_PATH, SAML_ENTITY_ID, SAML_IDP,
      # IDP_NUMBER, SAML_IDP_BASE_URL, SAML_SP_META_ID, SAML_SP_BASE_URL,
      # SAML_KEYS). See the Secret below.
      #
      # SIMPLESAMLPHP_CONFIG_DIR stays here deliberately: it is a path inside
      # the image, not a property of the environment, so it tracks the image
      # layout rather than the federation. Left unset, simplesamlphp silently
      # loads the stock example config bundled in its tarball - the one whose
      # entityID is https://myapp.example.org/ and whose idp is null - instead
      # of the app's own env-driven config.
      SIMPLESAMLPHP_CONFIG_DIR: "/opt/app-root/src/app/Config/saml/config"

      # --- webSSO / OIDC ----------------------------------------------------
      # Legacy: the application authenticates with SAML only. Kept because the
      # code still reads these, so leaving them unset is a null value in a
      # request URL rather than a cleanly disabled feature.
      URL_GARDIAN_WEBSSO: "https://rec-websso-gardian.myelectricnetwork.com:443/gardianwebsso/oauth2/multiauth"
      PATH_USERINFO: "/userinfo"
      PATH_JWKS: "/connect/jwk_uri"

      # --- HLK (Achatlake) --------------------------------------------------
      HLK_API_URL: "https://hlk-etl-api-preprod.edf.fr/eha"
      HLK_API_URL_V2: "https://hlk-etl-api-preprod.edf.fr/api"

      # --- mail -------------------------------------------------------------
      # SMTP is deliberately inert in preprod: the inventory sets SMTP_HOST to
      # the string "NULL" and ENABLE_CUSTOM_CONF to false.
      #
      # DEFAULT_SEND_EMAIL and BAL_FICHE_MARCHE are intentionally NOT set.
      # DEFAULT_SEND_EMAIL replaces each user's own address, so it is the guard
      # that stops preprod mailing real buyers; unset yields an empty recipient,
      # which fails safe, whereas a guessed address does not.
      ENABLE_CUSTOM_CONF: "false"
      SMTP_HOST: "NULL"
      SMTP_AUTH: "true"
      SMTP_USERNAME: "NULL"
      SMTP_PORT: "465"
      EMAIL_NO_REPLAY: "noreply@edf.fr"
      EMAIL_NO_REPLY_NAME: "Achatpedia"

  # ---------------------------------------------------------------------------
  # 4c. Application secrets
  #
  # Read from OpenBao by the get-secret job and passed in as template
  # parameters, the same path the TLS certificate takes. Nothing is committed
  # and no CI/CD variable holds any of it.
  #
  # DB_HOST/PORT/NAME/SCHEMA are not strictly secret, but they live beside the
  # credential in OpenBao so the whole connection is rotated in one place.
  # ---------------------------------------------------------------------------
  - apiVersion: v1
    kind: Secret
    type: Opaque
    metadata:
      name: "sec-backend-${APPLICATION_NAME}-${IMAGE_TAG}-app"
      namespace: "${NAMESPACE_DEPLOY_BACKEND}"
      labels:
        app: "backend-${APPLICATION_NAME}-${IMAGE_TAG}"
    stringData:
      # --- database ---------------------------------------------------------
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_NAME: "${DB_NAME}"
      DB_SCHEMA: "${DB_SCHEMA}"
      DB_USER: "${DB_USER}"
      DB_PWD: "${DB_PWD}"

      # --- webSSO / SAML ----------------------------------------------------
      # The whole federation configuration, not only the salt. Several of these
      # are not secrets in themselves - entity IDs, endpoint URLs and the IdP's
      # public certificate are all published in SAML metadata - but they are
      # held together so the federation is described in exactly one place and
      # can be repointed per environment without a commit.
      #
      # SAML_BASE_URL* are the *frontend* origin: the browser only ever talks
      # to the frontend, which proxies /api here, so every URL the IdP
      # redirects the browser to must be a frontend URL. get-secret enforces
      # that against FRONTEND_DNS_NAME, because moving these out of git also
      # moved them out of review.
      SAML_BASE_URL: "${SAML_BASE_URL}"
      SAML_BASE_URL_PATH: "${SAML_BASE_URL_PATH}"
      SAML_ENTITY_ID: "${SAML_ENTITY_ID}"
      SAML_IDP: "${SAML_IDP}"
      IDP_NUMBER: "${IDP_NUMBER}"
      SAML_IDP_BASE_URL: "${SAML_IDP_BASE_URL}"
      SAML_SP_META_ID: "${SAML_SP_META_ID}"
      SAML_SP_BASE_URL: "${SAML_SP_BASE_URL}"
      SAML_KEYS: "${SAML_KEYS}"
      SAML_SECRET_SALT: "${SAML_SECRET_SALT}"

      # --- mail and HLK -----------------------------------------------------
      SMTP_PWD: "${SMTP_PWD}"
      HLK_API_PASS: "${HLK_API_PASS}"
      HLK_API_PASS_V2: "${HLK_API_PASS_V2}"

  # ---------------------------------------------------------------------------
  # 4d. Server certificate for the pod's nginx
  #
  # The Route is passthrough, so TLS is terminated here rather than at the
  # router and the traffic between the router and this pod is encrypted too.
  # That means the pod needs the certificate for SERVER_NAME itself.
  #
  # Same certificate and the same OpenBao path the Route used while it was an
  # edge route - it is the certificate for the hostname, and which hop
  # terminates it does not change that.
  # ---------------------------------------------------------------------------
  - apiVersion: v1
    kind: Secret
    type: kubernetes.io/tls
    metadata:
      name: "sec-backend-${APPLICATION_NAME}-${IMAGE_TAG}-tls"
      namespace: "${NAMESPACE_DEPLOY_BACKEND}"
      labels:
        app: "backend-${APPLICATION_NAME}-${IMAGE_TAG}"
    stringData:
      tls.crt: "${TLS_CERTIFICATE}"
      tls.key: "${TLS_KEY}"

  # ---------------------------------------------------------------------------
  # 5. Route
  #
  # Edge termination: the pod's nginx serves plain HTTP on 8080 only, so
  # passthrough cannot work. This matches how the live eha-v3-preprod-api.edf.fr
  # route is configured. The host is a *.caas-ext-p.automation.edf.fr name
  # covered by the router's default wildcard certificate, so no certificate
  # material is needed here.
  # ---------------------------------------------------------------------------
  - kind: Route
    apiVersion: route.openshift.io/v1
    metadata:
      # Named after IMAGE_TAG like every other object in this template. The
      # Route was the one exception, carrying ENV ("recette") while the
      # Deployment and the ConfigMaps all carry the branch slug.
      #
      # Not cosmetic: spec.host is effectively immutable. The `custom-host`
      # authorizer grants the right to *create* a Route with a chosen host, but
      # an update that changes the host of an existing Route is refused:
      #
      #   The Route "backend-achatpedia-recette" is invalid: spec.host:
      #   Invalid value: "eha-v2-preprod-api-caas.edf.fr":
      #   you do not have permission to set the host field of the route
      #
      # That is not an RBAC gap - `oc auth can-i update routes/custom-host`
      # answers yes, and a dry-run *create* of the same host succeeds. So
      # `oc apply` can never move a Route to a new hostname, and the deploy
      # fails every run until the object is recreated.
      #
      # Renaming makes this run create a new Route instead of patching the old
      # one, which is allowed. The previous Route keeps serving the old host
      # until it is deleted by hand, so /api has no downtime during the switch.
      name: "backend-${APPLICATION_NAME}-${IMAGE_TAG}"
      labels:
        app: "backend-${APPLICATION_NAME}-${IMAGE_TAG}"
      annotations:
        haproxy.router.openshift.io/timeout: "${ROUTE_TIMEOUT}"
    spec:
      host: "${SERVER_NAME}"
      to:
        kind: Service
        name: "backend-${APPLICATION_NAME}"
        weight: 100
      port:
        # The pod's TLS listener, not 8080. With passthrough the router does no
        # TLS of its own - it forwards the encrypted stream to this port, so
        # pointing it at the plain-HTTP port would hand TLS bytes to a plain
        # HTTP listener.
        targetPort: https
      tls:
        # Passthrough, not edge: the connection stays encrypted from the client
        # all the way to the pod's nginx, so the router-to-pod hop inside the
        # cluster is no longer in the clear.
        #
        # No certificate or key here, by definition - the router never
        # terminates, so it has nothing to present. The certificate now lives
        # in sec-backend-<tag>-tls and is mounted into the nginx-rp container,
        # which serves it on 8443.
        #
        # insecureEdgeTerminationPolicy is None rather than Redirect: a
        # passthrough route cannot answer plain HTTP in order to redirect it,
        # because it does not terminate TLS and so cannot read the request.
        termination: passthrough
        insecureEdgeTerminationPolicy: None
      wildcardPolicy: None
