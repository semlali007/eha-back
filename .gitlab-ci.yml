spec:
  inputs:
    enable_sonar:
      type: boolean
      default: false
      description: "Enable SonarQube code quality scan"
    enable_sca:
      type: boolean
      default: false
      description: "Enable Checkmarx SCA (dependency) scan"
    enable_sast:
      type: boolean
      default: false
      description: "Enable Checkmarx SAST (source code) scan"
    enable_build:
      type: boolean
      default: true
      description: "Enable the build stage (OpenShift image build)"
    enable_copy:
      type: boolean
      default: true
      description: "Enable the copy-image stage (promote to the target registry)"
    enable_deploy:
      type: boolean
      default: true
      description: "Enable deployment to the target OpenShift namespace"
---
# =============================================================================
# Achatpedia backend (PHP-FPM 8.2) - build, promote and deploy on CaaS.
#
# Replaces the Jenkinsfile. The frontend and the backend live in separate
# repositories, so this pipeline deploys exactly one application; that avoids
# the documented deploy-kubernetes limitation around reusing the component
# twice in a single pipeline.
#
# Credentials are NOT loaded explicitly: the build, copy-image and deploy
# components each resolve their own CaaS credentials from the namespace name.
# =============================================================================

default:
  tags:
    - gitlab-runner-dvs-srv-int-p

stages:
  - prepare
  - scan-code
  - build
  - copy-image
  - deploy
  - clean

variables:
  APPLICATION_NAME: "achatpedia"
  IMAGE_NAME: "dck_achatpedia-back"

  # Namespaces: the build runs on caas-int-hp, the runtime lives on caas-ext-p.
  BUILD_NAMESPACE: "eha-achatpedia-grp-hp"
  NAMESPACE_DEPLOY_BACKEND: "eha-achatpedia-ext-ns-be-p"

  # Registries
  SOURCE_REGISTRY: "registry.apps.caas-int-hp.automation.edf.fr"
  TARGET_REGISTRY: "registry.apps.caas-ext-p.automation.edf.fr"

  MAINTAINER_EMAIL: "luca-externe.dall-olio@edf.fr"

  # The image tag is the branch slug, so branch `poc-caas` produces tag
  # `poc-caas`. Kept explicit rather than relying on the component default.
  IMAGE_TAG: "${CI_COMMIT_REF_SLUG}"

  # ---------------------------------------------------------------------------
  # OpenShift template parameters.
  # deploy-kubernetes resolves template parameters from the environment, so
  # every parameter declared in deploy/openshift/deploy-backend.yml must appear
  # here.
  # ---------------------------------------------------------------------------
  ENV: "recette"
  SERVICE_ACCOUNT_NAME: "achatpedia-caas-eha"
  # The public hostname of the backend. A CNAME points it at
  # vipcluster.ext-ns-be-p.caas-ext-p.automation.edf.fr (the be-p router VIP),
  # so the Route below is what makes the router answer for it - until this
  # Route claimed the host, the router replied 503 "Application is not
  # available", which is what the frontend logged as
  #   "GET /api/saml/login/... HTTP/1.1" 503 2515
  #
  # Reachable from the frontend pod only: the backend sits behind a firewall
  # and must never be called directly from a browser.
  SERVER_NAME: "eha-v2-preprod-api-caas.edf.fr"
  ELASTICSEARCH_HOST: "padaone-preprod.edf.fr:29443"
  ROUTE_TIMEOUT: "10m"
  # Sized to the namespace quota, not to appetite. gabarit-compute allows
  # limits.cpu=2 for the whole namespace and api-achatpedia-master already holds
  # 1000m of it, so the whole pod - four containers - must fit inside the
  # remaining 1000m. Totals: limits.cpu 900m, limits.memory 2112Mi,
  # requests.cpu 500m. Raise these only after checking `oc describe quota
  # gabarit-compute`.
  CPU_REQUEST: "300m"
  CPU_LIMIT: "500m"
  MEMORY_REQUEST: "1Gi"
  MEMORY_LIMIT: "1536Mi"
  LOCAL_REGISTRY: "image-registry.openshift-image-registry.svc:5000"
  NAMESPACE_REGISTRY: "image-registry.openshift-image-registry.svc:5000"

  # --- OpenBao (secret manager) -----------------------------------------------
  # Namespace == the DevSecOps subscription name, which is the top-level GitLab
  # group. Authentication is by GitLab JWT, so there is no token to configure.
  VAULT_SERVER_URL: "https://si-devops-secrets.edf.fr"
  VAULT_NAMESPACE: "eha-web-achat"
  VAULT_KV2: "dvs-project"
  # Use "jwt-ee" instead when the project is hosted on si-devops-gitlab-ee.edf.fr
  VAULT_JWT_NAME: "jwt"
  # The secret holds two keys: "certificate" and "key" (PEM).
  # Path = <GitLab branch>/<Secret Path as entered in MyDevOps>. MyDevOps
  # prepends the branch, so the value below is branch-scoped: a pipeline on a
  # branch other than poc-caas cannot read it.
  #
  # DISTINCT FROM THE FRONTEND'S. eha-front reads
  # poc-caas/eha-web-achat/eha-front/preprod/tls, which carries the certificate
  # for eha-v2-preprod-caas.edf.fr. This one carries the certificate for
  # eha-v2-preprod-api-caas.edf.fr. They are two different certificates for two
  # different hostnames and must not be pointed at the same path.
  VAULT_TLS_SECRET_PATH: "poc-caas/eha-web-achat/eha-back/preprod/tls"
  # Application secrets (DB connection, SAML salt, SMTP and HLK passwords).
  # Same namespace and mount as the TLS secret, different path.
  VAULT_APP_SECRET_PATH: "poc-caas/eha-web-achat/eha-back/preprod/app"

  # Public hostname of the frontend. Every SAML URL the IdP redirects the
  # browser to must be a frontend URL - the backend is firewalled. Must match
  # SERVER_NAME in eha-front/.gitlab-ci.yml.
  FRONTEND_DNS_NAME: "eha-v2-preprod-caas.edf.fr"


include:
  # ---------------------------------------------------------------------------
  # 0. CaaS credentials, as hpd/redis does it
  #
  # Exports DVS_CAAS_API_URL / DVS_CAAS_TOKEN under the given prefix, as a
  # dotenv artifact. The deploy job override at the bottom of this file turns
  # the destination pair into KUBE_URL / KUBE_TOKEN.
  # ---------------------------------------------------------------------------
  - component: $CI_SERVER_FQDN/dvs-components/load-caas-credentials/creds@main
    inputs:
      stage: prepare
      namespace: $BUILD_NAMESPACE
      job: "load-caas-credentials-source"
      env_secret_prefix: "SRC_CAAS_"

  - component: $CI_SERVER_FQDN/dvs-components/load-caas-credentials/creds@main
    inputs:
      stage: prepare
      namespace: $NAMESPACE_DEPLOY_BACKEND
      job: "load-caas-credentials-dest"
      env_secret_prefix: "DEST_CAAS_"

  # ---------------------------------------------------------------------------
  # 1. Code quality and security
  # ---------------------------------------------------------------------------
  - component: $CI_SERVER_FQDN/dvs-components/sonarqube/scan@0.2.0
    inputs:
      stage: scan-code
      sonar_quality_gate: true
      enable_sonar_scan: $[[ inputs.enable_sonar ]]

  - component: $CI_SERVER_FQDN/DVS/ci-template/components/security/scan-checkmarx@0.0.5
    inputs:
      stage_scan: scan-code
      enable_sca_scan: $[[ inputs.enable_sca ]]
      enable_sast_scan: $[[ inputs.enable_sast ]]
      # Both team names are required even when the matching scan is disabled.
      cx_sca_team_name: "/CxServer/SCA/EDF-SA/DAG/mtb-mtb"
      cx_flow_team_name: "/CxServer/SP/EDF-SA/DAG/mtb-mtb"
      base_project_name: "EHA_DAG_ACHATPEDIA_BACK"

  # ---------------------------------------------------------------------------
  # 2. Build the image
  #
  # build_auto_generate: true makes the component generate the BuildConfig with
  # `oc new-build`, so no build-template.yml is maintained in this repository.
  #
  # The image downloads simplesamlphp from the artifact deposit, authenticated
  # with DVS_DEPOSIT_PROJECT_TOKEN - a GitLab variable from the DevSecOps
  # subscription, holding a base64-encoded token that the Dockerfile decodes.
  # No OpenBao secret is involved; the earlier NEXUS_USERNAME/NEXUS_PASSWORD
  # pair pointed at the wrong host entirely.
  #
  # Caveat worth knowing: an auto-generated BuildConfig cannot reference a
  # secretKeyRef, so the deposit token is passed through build_env and its
  # literal text lands in the BuildConfig object in the build namespace,
  # readable by anyone with access to it. If that residual exposure is not
  # acceptable, switch to build_auto_generate: false with a committed build
  # template using secretKeyRef.
  #
  # STRATEGY: "source", not "docker". The s2i-readme's reference application
  # (_3b-esa/publique/test-app-php) has no Dockerfile at all; a Dockerfile is
  # sanctioned only to `dnf install` a missing RPM and must never invoke
  # /usr/libexec/s2i/assemble itself. Doing so is what produced
  # "Aucune version majeure n'est specifiee" from phpman. Build steps this
  # application needs live in .s2i/bin/assemble, which delegates to the image's
  # own assemble.
  #
  # IMAGE: alma8 on PHP 8.4.25, the version the s2i-readme recommends. The ubi8
  # 8.2 line cannot be used: cyber forbids anything below 8.2.33 and ubi8
  # publishes no such tag.
  # ---------------------------------------------------------------------------
  - component: $CI_SERVER_FQDN/dvs-components/openshift-build-image/build@0.3.1
    rules:
      - if: '"$[[ inputs.enable_build ]]" == "true"'
    inputs:
      stage_build: build
      stage_clean: clean
      job: "build-image-backend"
      env_project: $BUILD_NAMESPACE
      application_name: $APPLICATION_NAME
      build_name: "dck-achatpedia-back"
      build_auto_generate: true
      build_output_image: "${IMAGE_NAME}:${IMAGE_TAG}"
      # CONTEXT DIR: "src", not ".". src/ is the PHP project root and always has
      # been -- composer.json, phpunit.xml and the three entry points
      # (public/index.php, bin/console, tests/bootstrap.php) all live there and
      # all resolve vendor/ as a sibling of public/. The old Dockerfile matched
      # that with `COPY ./src /opt/app-root/src/`, which hoisted the contents of
      # src/ to the application root.
      #
      # Staging the repository root instead put every one of those paths off by
      # one directory: composer's psr-4 map pointed at a core/ that did not
      # exist, so the application died with
      #   Uncaught Error: Class "Core\Util\DotEnv" not found
      # after an earlier identical failure on ../vendor/autoload.php. Pointing
      # the context at src/ reproduces the layout the application expects
      # instead of patching the paths one pipeline run at a time.
      #
      # Consequences: .s2i/bin/assemble, php.ini and ${PHP_INSTANCE}.conf are all
      # resolved relative to the context dir, so they live in src/ too.
      build_context_dir: "src"
      build_strategy: "source"
      build_source_image: "openshift/dck_php-fpm-alma8:8.4.25-202601"
      # phpman creates and configures the instance *during* assemble, so these
      # have to be build-time. The legacy template set them as container env on
      # the Deployment, which is far too late. PHP_INSTANCE must match the value
      # in deploy-backend.yml, because it is also used at run time.
      #
      # PHP_EXTENSIONS is deliberately absent: build_env is comma-separated, and
      # the extension list is itself comma-separated, so it cannot be expressed
      # here without being split into junk variables. The extensions are loaded
      # by the php.ini at the repository root instead, which the image adopts in
      # place of its default.
      build_env: "PHP_INSTANCE=EHA,PHP_PORT=9000,PHP_FILE_DIR=/opt/app-root/src,COMPOSER_INSTALL=true,DVS_DEPOSIT_PROJECT_TOKEN=${DVS_DEPOSIT_PROJECT_TOKEN},APP_COMMIT=${CI_COMMIT_SHA},APP_COMMIT_DATE=${CI_COMMIT_TIMESTAMP}"
      build_cpu_request: "1"
      build_cpu_limit: "2"
      build_memory_request: "2Gi"
      build_memory_limit: "2Gi"
      env_prefix: "SRC_CAAS"

  # ---------------------------------------------------------------------------
  # 3. Promote the image from the build cluster to the runtime cluster
  #
  # caas-int-hp and caas-ext-p are distinct clusters with distinct registries,
  # so build_output_namespace cannot be used here - skopeo is required.
  # ---------------------------------------------------------------------------
  - component: $CI_SERVER_FQDN/dvs-components/skopeo/copy-image@0.1.0
    rules:
      - if: '"$[[ inputs.enable_copy ]]" == "true" && "$[[ inputs.enable_build ]]" == "true"'
    inputs:
      stage: copy-image
      job: "copy-backend-image"
      source_namespace: $BUILD_NAMESPACE
      source_image: "docker://${SOURCE_REGISTRY}/${BUILD_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}"
      source_tls_verify: false
      dest_namespace: $NAMESPACE_DEPLOY_BACKEND
      dest_image: "docker://${TARGET_REGISTRY}/${NAMESPACE_DEPLOY_BACKEND}/${IMAGE_NAME}:${IMAGE_TAG}"
      dest_tls_verify: false

  # ---------------------------------------------------------------------------
  # 4. Deploy from the descriptor committed in this repository
  # ---------------------------------------------------------------------------
  - component: $CI_SERVER_FQDN/DVS/ci-template/components/deployers/deploy-kubernetes@0.0.6
    rules:
      - if: '"$[[ inputs.enable_deploy ]]" == "true"'
    inputs:
      stage_deploy: deploy
      stage_clean: clean
      job: "deploy-achatpedia-backend"
      integ_ref: "/^(poc-caas|develop|main|master|preprod|production)$/"
      kube_namespace: $NAMESPACE_DEPLOY_BACKEND
      application_name: $APPLICATION_NAME
      deployment_dir: "deploy/openshift"
      template_file: "deploy-backend.yml"
      deployment_name: "backend-${APPLICATION_NAME}-${IMAGE_TAG}"
      integ_application_url: "https://${SERVER_NAME}"

# =============================================================================
# OpenBao access, shared by the validation gate and the deploy job.
#
# Reads two paths in the eha-web-achat namespace:
#   <branch>/eha-web-achat/eha-back/preprod/tls  - certificate, key (PEM)
#   <branch>/eha-web-achat/eha-back/preprod/app  - the application secrets
# and exports the values as environment variables, which is what `oc process`
# resolves template parameters from.
#
# NOT carried between jobs as a dotenv artifact, which is how the frontend and
# hpd/redis do it. Two reasons:
#
#   * GitLab caps a dotenv artifact at 5120 bytes. A TLS certificate, its key
#     and seventeen application secrets do not fit - the upload fails with
#     "Dotenv Artifact Too Big" *after* the job has otherwise succeeded, so the
#     job goes green and the deploy fails later on unset variables.
#   * A job artifact is downloadable by anyone who can see the pipeline. Not
#     passing secrets through one keeps the private key out of GitLab's
#     artifact storage entirely.
#
# Each job that needs the values reads them itself. The cost is a second
# round trip to OpenBao; the benefit is no size ceiling and no secret at rest.
#
# PREREQUISITE - both paths created from MyDevOps, which is what generates the
# matching policy. A path created by hand in the OpenBao UI returns
# "permission denied" here.
# =============================================================================
.openbao:
  script:
    # 1. Exchange the GitLab JWT for an OpenBao token.
    - |
      set +x
      REQUEST_TOKEN=$(curl -sS --request POST \
        --data "{\"jwt\":\"${VAULT_ID_TOKEN}\"}" \
        "${VAULT_SERVER_URL}/v1/${VAULT_NAMESPACE}/auth/${VAULT_JWT_NAME}/login")
      JWT_TOKEN=$(echo "${REQUEST_TOKEN}" | jq -r '.auth.client_token // empty')
      if [ -z "${JWT_TOKEN}" ]; then
        echo "ERROR: OpenBao login failed."
        echo "${REQUEST_TOKEN}" | jq -r '.errors // .' 2>/dev/null || true
        exit 1
      fi

    # 2. TLS certificate and key. Written to files rather than through a shell
    #    variable so openssl can check them, then exported and shredded.
    - |
      set +x
      umask 077
      SECRET_REQUEST=$(curl -sS --header "X-Vault-Token: ${JWT_TOKEN}" \
        "${VAULT_SERVER_URL}/v1/${VAULT_NAMESPACE}/${VAULT_KV2}/data/${VAULT_TLS_SECRET_PATH}")
      echo "${SECRET_REQUEST}" | jq -r '.data.data.certificate // empty' > tls.crt
      echo "${SECRET_REQUEST}" | jq -r '.data.data.key         // empty' > tls.key
      if [ ! -s tls.crt ] || [ ! -s tls.key ]; then
        echo "ERROR: could not read 'certificate'/'key' at ${VAULT_KV2}/${VAULT_TLS_SECRET_PATH}"
        echo "${SECRET_REQUEST}" | jq -r '.errors // "no errors field - check the path and the key names"'
        exit 1
      fi
      echo "TLS certificate read from OpenBao:"
      openssl x509 -in tls.crt -noout -subject -enddate

    # 3. Fail rather than publish a certificate that does not match the host
    #    the Route claims. Not a browser warning in this case: the frontend's
    #    nginx would refuse the upstream handshake and every /api call fails.
    - |
      set +x
      if ! openssl x509 -in tls.crt -noout -checkhost "${SERVER_NAME}" >/dev/null 2>&1; then
        echo "ERROR: certificate does not match ${SERVER_NAME}"
        openssl x509 -in tls.crt -noout -subject -ext subjectAltName || true
        exit 1
      fi
      if ! openssl x509 -in tls.crt -noout -checkend 0 >/dev/null 2>&1; then
        echo "ERROR: certificate has expired"
        openssl x509 -in tls.crt -noout -enddate
        exit 1
      fi
      export TLS_CERTIFICATE="$(cat tls.crt)"
      export TLS_KEY="$(cat tls.key)"
      shred -u tls.crt tls.key 2>/dev/null || rm -f tls.crt tls.key

    # 4. The application secrets.
    - |
      set +x
      APP_REQUEST=$(curl -sS --header "X-Vault-Token: ${JWT_TOKEN}" \
        "${VAULT_SERVER_URL}/v1/${VAULT_NAMESPACE}/${VAULT_KV2}/data/${VAULT_APP_SECRET_PATH}")
      if ! echo "${APP_REQUEST}" | jq -e '.data.data' >/dev/null 2>&1; then
        echo "ERROR: could not read ${VAULT_KV2}/${VAULT_APP_SECRET_PATH}"
        echo "${APP_REQUEST}" | jq -r '.errors // "no errors field - check the path"'
        exit 1
      fi

      # Show what the path actually holds *before* validating it. Printing this
      # only on success is what makes a missing-key failure hard to act on:
      # you learn one name that is absent and nothing about what is present,
      # so a typo looks identical to an omission.
      echo "Keys present at ${VAULT_APP_SECRET_PATH}:"
      echo "${APP_REQUEST}" | jq -r '.data.data | keys[] | "  - \(.)"'

      # Report every missing key in one pass rather than failing on the first:
      # each round trip here costs a pipeline run.
      MISSING=""
      for k in DB_HOST DB_PORT DB_NAME DB_SCHEMA DB_USER DB_PWD \
               SAML_BASE_URL SAML_BASE_URL_PATH SAML_ENTITY_ID \
               SAML_IDP IDP_NUMBER SAML_IDP_BASE_URL \
               SAML_KEYS SAML_SECRET_SALT \
               SMTP_PWD HLK_API_PASS HLK_API_PASS_V2; do
        if ! echo "${APP_REQUEST}" | jq -e --arg k "$k" '.data.data[$k] // empty' >/dev/null; then
          MISSING="${MISSING} ${k}"
        fi
      done
      if [ -n "${MISSING}" ]; then
        echo "ERROR: missing or empty at ${VAULT_APP_SECRET_PATH}:"
        for k in ${MISSING}; do echo "  - ${k}"; done
        echo
        echo "Keys are named after the APPLICATION's environment variables, not"
        echo "after the Ansible variables the values come from - the whole secret"
        echo "is consumed as container environment. Compare with the list above;"
        echo "a key present but empty fails the same way as one that is absent."
        exit 1
      fi
      echo "All 17 required keys present."

      # SAML_SP_META_ID and SAML_SP_BASE_URL are optional on purpose. They feed
      # only saml20-sp-remote.php, which describes a *remote SP* and is read
      # solely when simplesamlphp acts as an IdP - and config.php sets
      # 'enable.saml20-idp' => false, so this deployment never consults it.
      #
      # They also describe the Gardian websso *proxy*, which this project
      # should not use: the proxy cannot do MFA over the internet, which is
      # why the live path goes to the non-proxy IdP via IDP_NUMBER=idp11-*.
      for k in SAML_SP_META_ID SAML_SP_BASE_URL; do
        if ! echo "${APP_REQUEST}" | jq -e --arg k "$k" '.data.data[$k] // empty' >/dev/null; then
          echo "note: optional key '$k' not set - unused while enable.saml20-idp is false"
        fi
      done

    # 5. The SAML base URLs must be the *frontend* origin: the browser only
    #    ever talks to the frontend, which proxies /api to this backend, so
    #    every URL the IdP redirects it to has to be a frontend URL. Pointing
    #    any of them at the backend host produces a login loop that looks like
    #    an IdP fault.
    #
    #    Checked here because these values live in OpenBao rather than in the
    #    committed template: that buys per-environment control, but it also
    #    takes them out of code review, so the invariant has to be enforced
    #    rather than assumed.
    - |
      set +x
      for k in SAML_BASE_URL SAML_BASE_URL_PATH SAML_ENTITY_ID; do
        v=$(echo "${APP_REQUEST}" | jq -r --arg k "$k" '.data.data[$k]')
        case "$v" in
          "https://${FRONTEND_DNS_NAME}"|"https://${FRONTEND_DNS_NAME}/"*) ;;
          *)
            echo "ERROR: $k is '$v'"
            echo "       It must start with https://${FRONTEND_DNS_NAME} (the frontend)."
            echo "       The backend is firewalled and is never addressed by the browser."
            exit 1 ;;
        esac
      done
      echo "SAML base URLs verified against ${FRONTEND_DNS_NAME}"

    # 6. Normalise SAML_KEYS.
    #
    #    simplesamlphp's metadata files use the value verbatim as
    #    X509Certificate, which must be bare base64 DER on one line. The secret
    #    is held in PEM instead, because PEM is what every tool emits and what
    #    a human can paste back without reformatting - so strip the armour here
    #    rather than make the stored value awkward to maintain. Stripping a
    #    value that is already bare is a no-op, so both forms are accepted.
    - |
      set +x
      SAML_KEYS_DER=$(echo "${APP_REQUEST}" | jq -r '.data.data.SAML_KEYS' \
        | sed -e '/-----BEGIN/d' -e '/-----END/d' | tr -d ' \t\r\n')
      if [ -z "${SAML_KEYS_DER}" ]; then
        echo "ERROR: SAML_KEYS is empty after stripping the PEM armour"
        exit 1
      fi
      # Prove it is a certificate before shipping it: a truncated paste would
      # otherwise surface at login as an opaque signature-validation failure.
      printf -- '-----BEGIN CERTIFICATE-----\n%s\n-----END CERTIFICATE-----\n' \
        "$(echo "${SAML_KEYS_DER}" | fold -w 64)" > idp.crt
      if ! openssl x509 -in idp.crt -noout -subject -enddate; then
        echo "ERROR: SAML_KEYS is not a parseable X.509 certificate"
        rm -f idp.crt; exit 1
      fi
      if ! openssl x509 -in idp.crt -noout -checkend 0 >/dev/null 2>&1; then
        echo "WARNING: the IdP certificate in SAML_KEYS has expired - SSO will fail"
      fi
      rm -f idp.crt
      echo "SAML_KEYS normalised to bare base64 (${#SAML_KEYS_DER} chars)"

    # 7. Export one variable per key, with the normalised certificate and empty
    #    defaults for the optional pair. @sh quotes each value, so a password
    #    containing a space, a quote or a '#' survives intact.
    - |
      set +x
      eval "$(echo "${APP_REQUEST}" | jq -r --arg k "${SAML_KEYS_DER}" '
        .data.data
        | .SAML_KEYS = $k
        | .SAML_SP_META_ID //= ""
        | .SAML_SP_BASE_URL //= ""
        | to_entries[] | "export \(.key)=\(.value|@sh)"')"
      echo "Application configuration exported."

# =============================================================================
# Validation gate.
#
# Runs the whole OpenBao read in `prepare` and throws the values away. Its only
# job is to fail the pipeline before the image is built when the secrets are
# missing, malformed, or point at the wrong host - a build takes minutes, this
# takes seconds.
#
# It publishes nothing: the deploy job does its own read (see above).
# =============================================================================
get-secret:
  stage: prepare
  image: $NAMESPACE_REGISTRY/edf-infra-dvs-catalog/agt_deploy_cloud:latest
  tags:
    - gitlab-runner-dvs-srv-int-p
  rules:
    - if: '"$[[ inputs.enable_deploy ]]" == "true"'
  id_tokens:
    VAULT_ID_TOKEN:
      aud: "https://si-devops-secrets.edf.fr"
  script:
    - !reference [.openbao, script]
    - echo "Secrets validated. The deploy job reads them directly."

# =============================================================================
# Deploy job override, following hpd/redis.
#
# Supplies KUBE_URL / KUBE_TOKEN from the destination credentials loaded above,
# and reads OpenBao itself - `oc process` resolves template parameters from the
# environment, and an environment variable holds a multi-line PEM perfectly
# well.
#
# JOB NAME: the component generates one variant per ref type. On `poc-caas`,
# which matches integ_ref, the job is `dvs-deploy-achatpedia-backend:integration`
# - confirmed against the expanded pipeline, not guessed:
#
#   python plugins/gitlab/scripts/ci_lint.py \
#     --project eha-web-achat/eha-back --ref poc-caas --jobs
#
# hpd/redis overrides `:branch`, the variant for a ref that does NOT match
# integ_ref. Copying that name here would have been silent: `:branch` exists but
# is ruled out on this ref, so these exports would never have run. Both variants
# are overridden so the pipeline behaves on any branch.
# =============================================================================
.deploy-overrides: &deploy_overrides
  id_tokens:
    VAULT_ID_TOKEN:
      aud: "https://si-devops-secrets.edf.fr"
  needs:
    - job: get-secret
      artifacts: false
    - job: load-caas-credentials-dest
      artifacts: true
    # `needs` replaces stage ordering: without this the deploy could start
    # before the image has been promoted to the runtime cluster.
    - job: copy-backend-image
      optional: true
      artifacts: false
  before_script:
    - export KUBE_URL="${DEST_CAAS_DVS_CAAS_API_URL}"
    - export KUBE_TOKEN="${DEST_CAAS_DVS_CAAS_TOKEN}"
    - !reference [.openbao, script]
    - !reference [.os-deploy-base, before_script]

dvs-deploy-achatpedia-backend:integration:
  <<: *deploy_overrides

dvs-deploy-achatpedia-backend:branch:
  <<: *deploy_overrides
